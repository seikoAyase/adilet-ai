services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kz_legal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kz_legal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kz_legal_password}
      POSTGRES_DB: ${POSTGRES_DB:-kz_legal_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kz_legal_user} -d ${POSTGRES_DB:-kz_legal_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
